name = "fayl-uzatish-bot"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Sayt manzili (CORS). Bir nechta bo'lsa vergul bilan: https://a.github.io,https://mening-domen.uz
ALLOWED_ORIGIN = "https://aziyz123.github.io"

# `wrangler kv namespace create FAYL_KV` buyrug'i chiqargan id ni shu yerga qo'ying:
[[kv_namespaces]]
binding = "FAYL_KV"
id = "BU_YERGA_KV_ID_NI_QOYING"

# Maxfiy qiymatlar faylga yozilmaydi:
#   wrangler secret put BOT_TOKEN        (BotFather bergan token)
#   wrangler secret put WEBHOOK_SECRET   (o'zingiz o'ylab topgan uzun tasodifiy matn, faqat harf/raqam/_/-)
