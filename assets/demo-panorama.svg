<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2048" viewBox="0 0 4096 2048">
  <defs>
    <linearGradient id="ceil" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1018"/>
      <stop offset="0.55" stop-color="#152033"/>
      <stop offset="1" stop-color="#1c2a40"/>
    </linearGradient>
    <linearGradient id="wallG" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a52"/>
      <stop offset="0.4" stop-color="#1e2d44"/>
      <stop offset="1" stop-color="#162235"/>
    </linearGradient>
    <linearGradient id="floorG" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3428"/>
      <stop offset="0.35" stop-color="#2a2218"/>
      <stop offset="1" stop-color="#15120e"/>
    </linearGradient>
    <linearGradient id="goldL" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d5a0"/>
      <stop offset="1" stop-color="#9a7a35"/>
    </linearGradient>
    <pattern id="marble" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#1a2436"/>
      <path d="M0 60 H120 M60 0 V120" stroke="#2a3a52" stroke-width="2"/>
      <circle cx="60" cy="60" r="8" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity=".35"/>
    </pattern>
    <pattern id="floorTile" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="#2c241c"/>
      <rect x="2" y="2" width="156" height="156" fill="none" stroke="#5a4a32" stroke-width="3"/>
      <path d="M80 20 L140 80 L80 140 L20 80Z" fill="none" stroke="#c9a84c" stroke-width="2" opacity=".4"/>
    </pattern>
    <radialGradient id="lamp" cx="50%" cy="40%" r="50%">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".9"/>
      <stop offset="0.4" stop-color="#e3c77e" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e3c77e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- CEILING -->
  <rect width="4096" height="580" fill="url(#ceil)"/>
  <g stroke="#c9a84c" stroke-width="6" opacity=".25">
    <path d="M0 200 Q512 120 1024 200"/>
    <path d="M1024 200 Q1536 120 2048 200"/>
    <path d="M2048 200 Q2560 120 3072 200"/>
    <path d="M3072 200 Q3584 120 4096 200"/>
  </g>
  <ellipse cx="512" cy="160" rx="180" ry="90" fill="url(#lamp)"/>
  <ellipse cx="1536" cy="160" rx="180" ry="90" fill="url(#lamp)"/>
  <ellipse cx="2560" cy="160" rx="180" ry="90" fill="url(#lamp)"/>
  <ellipse cx="3584" cy="160" rx="180" ry="90" fill="url(#lamp)"/>

  <!-- WALLS -->
  <rect y="560" width="4096" height="780" fill="url(#wallG)"/>
  <rect y="560" width="4096" height="780" fill="url(#marble)" opacity=".55"/>

  <g fill="none" stroke="#c9a84c" stroke-width="10" opacity=".85">
    <path d="M120 720 Q360 580 600 720"/>
    <path d="M120 720 V1180 H600 V720"/>
    <rect x="180" y="780" width="360" height="280" rx="8" fill="#0f1724" stroke="#e3c77e" stroke-width="6"/>
    <path d="M1144 720 Q1384 580 1624 720"/>
    <path d="M1144 720 V1180 H1624 V720"/>
    <rect x="1204" y="780" width="360" height="280" rx="8" fill="#0f1724" stroke="#e3c77e" stroke-width="6"/>
    <path d="M2168 720 Q2408 580 2648 720"/>
    <path d="M2168 720 V1180 H2648 V720"/>
    <rect x="2228" y="780" width="360" height="280" rx="8" fill="#0f1724" stroke="#e3c77e" stroke-width="6"/>
    <path d="M3192 720 Q3432 580 3672 720"/>
    <path d="M3192 720 V1180 H3672 V720"/>
    <rect x="3252" y="780" width="360" height="280" rx="8" fill="#0f1724" stroke="#e3c77e" stroke-width="6"/>
  </g>

  <g fill="#1a1520" stroke="#b8903e" stroke-width="4">
    <rect x="210" y="810" width="300" height="200" rx="4"/>
    <rect x="1234" y="810" width="300" height="200" rx="4"/>
    <rect x="2258" y="810" width="300" height="200" rx="4"/>
    <rect x="3282" y="810" width="300" height="200" rx="4"/>
  </g>
  <g fill="#e3c77e" opacity=".12">
    <rect x="210" y="810" width="300" height="200" rx="4"/>
    <rect x="1234" y="810" width="300" height="200" rx="4"/>
    <rect x="2258" y="810" width="300" height="200" rx="4"/>
    <rect x="3282" y="810" width="300" height="200" rx="4"/>
  </g>

  <g fill="#243348" stroke="#c9a84c" stroke-width="5">
    <rect x="720" y="640" width="70" height="540" rx="6"/>
    <rect x="1744" y="640" width="70" height="540" rx="6"/>
    <rect x="2768" y="640" width="70" height="540" rx="6"/>
    <rect x="3792" y="640" width="70" height="540" rx="6"/>
  </g>
  <g fill="url(#goldL)" opacity=".7">
    <rect x="720" y="640" width="70" height="18"/>
    <rect x="720" y="1162" width="70" height="18"/>
    <rect x="1744" y="640" width="70" height="18"/>
    <rect x="1744" y="1162" width="70" height="18"/>
    <rect x="2768" y="640" width="70" height="18"/>
    <rect x="2768" y="1162" width="70" height="18"/>
    <rect x="3792" y="640" width="70" height="18"/>
    <rect x="3792" y="1162" width="70" height="18"/>
  </g>

  <!-- FLOOR -->
  <rect y="1320" width="4096" height="728" fill="url(#floorG)"/>
  <rect y="1320" width="4096" height="728" fill="url(#floorTile)" opacity=".75"/>
  <g stroke="#c9a84c" stroke-width="2" opacity=".2">
    <path d="M0 1340 L2048 1320 L4096 1340"/>
    <path d="M200 2048 L2048 1360 L3896 2048"/>
    <path d="M800 2048 L2048 1380 L3296 2048"/>
    <path d="M1400 2048 L2048 1400 L2696 2048"/>
  </g>

  <text x="2048" y="980" text-anchor="middle" fill="#e3c77e" font-family="Georgia, serif" font-size="36" opacity=".35">REGISTON · BETA</text>
  <text x="2048" y="1030" text-anchor="middle" fill="#9ab" font-family="system-ui,sans-serif" font-size="20" opacity=".4">360° demo panorama</text>
</svg>
