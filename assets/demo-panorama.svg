 <path d="M90 410 L320 330 540 415 540 690 90 690Z"/>
 <path d="M1860 415 L2080 330 2310 410 2310 690 1860 690Z"/>
</g>
<!-- arches / pillars suggestion -->
<g fill="none" stroke="#e3c77e" stroke-width="8" opacity=".85">
 <path d="M820 360 Q980 300 1140 360"/>
 <path d="M1260 360 Q1420 300 1580 360"/>
 <path d="M180 420 Q300 360 420 420"/>
 <path d="M1980 420 Q2100 360 2220 420"/>
