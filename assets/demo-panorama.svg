<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#223d5b"/><stop offset=".55" stop-color="#a9b9bd"/><stop offset="1" stop-color="#d7c49b"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#b99b69"/><stop offset="1" stop-color="#59452f"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#d5b987"/><stop offset="1" stop-color="#8f6844"/></linearGradient>
 <pattern id="tiles" width="90" height="90" patternUnits="userSpaceOnUse"><rect width="90" height="90" fill="#174b79"/><path d="M45 5 85 45 45 85 5 45Z" fill="none" stroke="#e3c77e" stroke-width="5"/><circle cx="45" cy="45" r="12" fill="#1ca1a1"/></pattern>
</defs>
<rect width="2400" height="1200" fill="url(#sky)"/>
<rect y="690" width="2400" height="510" fill="url(#floor)"/>
<path d="M0 720 Q1200 620 2400 720" fill="none" stroke="#e5d1a7" stroke-width="18"/>
<!-- stylized museum gallery walls -->
<g fill="url(#wall)" stroke="#6e4c32" stroke-width="12">
 <path d="M0 330 L350 220 650 350 650 800 0 800Z"/>
 <path d="M1750 350 L2050 220 2400 330 2400 800 1750 800Z"/>
 <path d="M650 350 L1200 240 1750 350 1750 800 650 800Z"/>
</g>
<g fill="url(#tiles)" stroke="#e0c17a" stroke-width="12">
