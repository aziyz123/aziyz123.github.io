 <path d="M900 0 L1100 0 1250 700 750 700Z"/>
 <path d="M1500 0 L1700 0 1850 700 1350 700Z"/>
</g>
<!-- center label for orientation -->
<text x="1200" y="520" text-anchor="middle" fill="#f3f0e8" font-family="Georgia, serif" font-size="42" opacity=".55">REGISTON · BETA DEMO</text>
<text x="1200" y="570" text-anchor="middle" fill="#e3c77e" font-family="system-ui,sans-serif" font-size="22" opacity=".7">360° panorama placeholder</text>
