<!DOCTYPE html>

<head>

<style>
body{margin:0;background:#14161C;color:#F3EFE4;font-family:system-ui;display:grid;place-items:center;min-height:100vh}
.box{text-align:center;padding:24px}

<body>
<div class="box">
  <div class="gold" style="font-size:28px;margin-bottom:12px">⚔️ Jang xaritasi</div>
  <div id="st">Yuklanmoqda...</div>
</div>
<script src="html-b64-0.js?v=8"></script>
<script src="html-b64-1.js?v=8"></script>

<script src="html-b64-9.js?v=8"></script>
<script src="html-b64-10.js?v=8"></script>
<script>
(function(){
  var st = document.getElementById('st');
  try {
    var parts = window.__JANG_HTML_B64 || [];
    if(parts.length < 11){ st.textContent = 'Qismlar yetarli emas ('+parts.length+'/11). Sahifani yangilang.'; return; }
    st.textContent = 'Qayta yig\'ilmoqda...';
    var b64 = parts.join('');
    var html = decodeURIComponent(escape(atob(b64)));
    st.textContent = 'Ochilmoqda...';
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    st.textContent = 'Xato: ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
