<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14213A">
<title>Virtual muzey — Registon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root{ --navy:#14213A; --navy2:#1F3354; --brass:#B8903E; --brass-l:#E3C77E; --ivory:#F3F0E8; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#0A1220; color:var(--ivory); font-family:Inter,system-ui,-apple-system,sans-serif; overflow:hidden; overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas{ display:block; width:100%; height:100%; }
  #gl{ position:fixed; inset:0; }
  .ui{ position:fixed; z-index:5; }
  .top{ left:0; right:0; top:0; padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left)); display:flex; gap:8px; align-items:center; pointer-events:none; }
  .top>*{ pointer-events:auto; }
  .pill{ background:rgba(20,33,58,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--ivory); border:1px solid rgba(227,199,126,.35); border-radius:999px; font:600 13px/1 Inter,system-ui,sans-serif; padding:11px 15px; min-height:42px; display:inline-flex; align-items:center; gap:6px; text-decoration:none; cursor:pointer; }
  .pill.on{ background:linear-gradient(150deg,var(--brass-l),var(--brass)); color:#14213A; border-color:transparent; }
  .title{ margin-left:auto; font:600 15px Georgia,'Newsreader',serif; background:rgba(20,33,58,.8); padding:9px 14px; border-radius:999px; pointer-events:none; white-space:nowrap; }
  .places{ left:0; right:0; bottom:0; padding:0 max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:10px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips .pill{ flex:0 0 auto; }
  .info{ background:rgba(20,33,58,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(227,199,126,.35); border-radius:20px; padding:14px 16px; max-width:560px; }
  .info h3{ margin:0 0 4px; font:600 20px Georgia,'Newsreader',serif; }
  .info p{ margin:0; font-size:13.5px; line-height:1.55; color:#D7DCE8; }
  .info small{ display:block; margin-top:8px; font-size:11.5px; color:#9AA6BC; }
  .pad{ position:fixed; z-index:5; left:max(14px,env(safe-area-inset-left)); bottom:calc(150px + env(safe-area-inset-bottom)); width:132px; height:132px; border-radius:50%; background:rgba(20,33,58,.45); border:1px solid rgba(227,199,126,.35); touch-action:none; }
  .pad i{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:linear-gradient(150deg,var(--brass-l),var(--brass)); opacity:.9; }
  .hint{ left:50%; top:62px; transform:translateX(-50%); background:rgba(20,33,58,.8); border-radius:999px; padding:8px 14px; font-size:12.5px; color:#D7DCE8; white-space:nowrap; pointer-events:none; transition:opacity .6s; }
  body.vr .ui,body.vr .pad{ display:none; }
  body.vr .vrexit{ display:flex; }
  .vrexit{ display:none; position:fixed; z-index:9; left:50%; top:max(8px,env(safe-area-inset-top)); transform:translateX(-50%); }
  .vrdiv{ display:none; position:fixed; z-index:8; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:#000; }
  body.vr .vrdiv{ display:block; }
  #load{ position:fixed; inset:0; z-index:20; background:#0A1220; display:flex; align-items:center; justify-content:center; font:600 18px Georgia,serif; color:var(--brass-l); }
</style>
</head>
<body>
<div id="load">Muzey yuklanmoqda…</div>
<canvas id="gl"></canvas>
<div class="vrdiv"></div>
<button class="pill vrexit" id="vrExit" type="button">✕ VR'dan chiqish</button>

<div class="ui top">
  <a class="pill" href="index.html" aria-label="Bosh sahifa">⌂ Bosh</a>
  <button class="pill" id="gyroBtn" type="button">🧭 Giroskop</button>
  <button class="pill" id="vrBtn" type="button">🥽 VR</button>
  <button class="pill on" id="qBtn" type="button">✨ Sifat: yuqori</button>
  <div class="title">Registon maydoni</div>
</div>
<div class="ui hint" id="hint">Ekranni suring — atrofga qarang. Chapdagi doira bilan yuring</div>
<div class="pad" id="pad"><i id="knob"></i></div>

<div class="ui places">
  <div class="info" id="info"></div>
  <div class="chips" id="chips"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="muzey-registon.js"></script>
<script src="muzey-app.js"></script>
</body>
</html>
