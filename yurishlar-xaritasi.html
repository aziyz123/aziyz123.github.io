<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#070b14">
<title>Amir Temur davlati kengayishi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#070b14;--panel:#0c1524;--line:#1c2c44;--gold:#d4a84b;--gold2:#f0d078;--text:#eef3fb;--muted:#8fa0b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit}
.topbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101928,#0a101c);z-index:40;position:relative}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:9px;border:1px solid #8a6a2e;flex:none;background:radial-gradient(circle at 30% 30%,#3a2a12,#1a1408);display:grid;place-items:center;font-size:15px}
.logo h1{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;line-height:1.2;color:var(--gold2)}
.logo small{display:block;font-size:8px;color:var(--muted);font-weight:400;margin-top:1px}
.timeline{flex:1;display:flex;align-items:center;justify-content:safe center;gap:2px;overflow-x:auto}
.tl-item{border:none;background:transparent;color:var(--muted);padding:5px 9px;border-radius:999px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
.tl-item .yr{font-size:12px;font-weight:700}.tl-item .lb{font-size:7px;text-transform:uppercase;opacity:.7}
.tl-item.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0e17;box-shadow:0 0 14px #d4a84b55}
.tl-item.active .lb{color:#3a2a10;opacity:1}
.home{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;flex:none}
.stage{height:calc(100% - 56px - 148px);position:relative;overflow:hidden;background:#0a121c;display:flex;align-items:center;justify-content:center}
.map-frame{position:relative;width:100%;height:100%;max-width:1400px;margin:0 auto}
.map-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.tint{position:absolute;inset:0;pointer-events:none;transition:opacity .4s ease;opacity:0;mix-blend-mode:soft-light}
.tint.on{opacity:1}
.tint.y1336{background:radial-gradient(ellipse at 55% 45%, #3b82c488 0%, transparent 45%)}
.tint.y1370{background:radial-gradient(ellipse at 50% 50%, #d4a01755 0%, transparent 55%)}
.tint.y1380{background:radial-gradient(ellipse at 40% 45%, #e07a2f55 0%, transparent 50%)}
.tint.y1390{background:radial-gradient(ellipse at 50% 48%, #c93c3c44 0%, transparent 60%)}
.hotspot{position:absolute;width:28px;height:28px;margin-left:-14px;margin-top:-14px;border-radius:50%;border:2px solid #0a0e17;background:var(--gold);color:#0a0e17;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;z-index:5;box-shadow:0 0 10px #d4a84b77;transition:transform .15s, opacity .3s}
.hotspot:hover{transform:scale(1.15)}
.hotspot.hidden{opacity:0;pointer-events:none;transform:scale(.6)}
.hotspot.capital{background:var(--gold2);width:22px;height:22px;margin-left:-11px;margin-top:-11px;font-size:10px;box-shadow:0 0 12px #f0d07899}
.float{position:absolute;z-index:8;background:rgba(12,21,36,.9);border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:10px;color:var(--muted)}
.float.cap{top:10px;right:10px}.float.leg{bottom:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.float b{color:var(--gold2);font-size:11px}.float .row{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.bottom{height:148px;border-top:1px solid var(--line);background:linear-gradient(180deg,#0d1524,#0a101c);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.bio-row{display:flex;gap:12px;align-items:center}
.portrait{width:52px;height:60px;border-radius:10px;border:1px solid #8a6a2e;flex:none;background:radial-gradient(circle at 50% 30%,#c9a05044,transparent 45%),linear-gradient(180deg,#2a1c0a,#0e0a05);display:grid;place-items:center;font-size:26px}
.bio-text h3{font-family:'Cinzel',serif;font-size:12px;color:var(--gold2)}
.bio-text p{font-size:10px;color:var(--muted);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cards-head h2{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.cards{display:flex;gap:8px;overflow-x:auto}
.card{min-width:132px;flex:none;background:#111c2e;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}
.card:hover{border-color:#8a6a2e}.card .cy{font-size:10px;font-weight:700;color:var(--gold)}.card h4{font-size:11px;margin:3px 0 2px}.card p{font-size:9px;color:var(--muted)}
dialog{border:1px solid #526078;border-radius:16px;background:#0d1524;color:var(--text);padding:20px;max-width:380px;width:calc(100% - 24px)}
dialog::backdrop{background:#02060bd9}dialog h3{font-family:'Cinzel',serif;color:var(--gold2);margin:6px 0 8px;font-size:16px}
dialog p{font-size:13px;color:var(--muted);line-height:1.55}
dialog .close-x{float:right;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
@media(min-width:800px){.logo h1{font-size:13px}.bottom{height:160px}.portrait{width:64px;height:74px;font-size:32px}.bio-text p{-webkit-line-clamp:3;font-size:11px}.hotspot{width:32px;height:32px;margin-left:-16px;margin-top:-16px;font-size:13px}}
.geo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%}
.geo svg{position:absolute;inset:0;width:100%;height:100%}
.geo #spots{position:absolute;inset:0}
.hotspot .pl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-style:normal;font-size:9px;font-weight:600;color:var(--gold2);white-space:nowrap;text-shadow:0 0 4px #000,0 0 6px #000;pointer-events:none}
.hotspot .yr{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;font-style:normal;font-size:9px;font-weight:700;color:#fff;background:#0a0e17cc;border:1px solid #8a6a2e;border-radius:999px;padding:0 5px;white-space:nowrap;pointer-events:none}
.legend-stages{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="./"><div class="logo-mark">⚔</div><div><h1>AMIR TEMUR<br>DAVLATI KENGAYISHI</h1><small>Buyuk imperiyaning yuksalish yo‘li</small></div></a>
  <nav class="timeline" id="timeline"></nav>
  <button class="home" onclick="location.href='./'">⌂</button>
</header>
<div class="stage">
  <div class="map-frame">
    <img class="map-bg" id="mapBg" alt="Amir Temur davlati xaritasi">
    <div class="geo" id="geo"><svg id="geoSvg" viewBox="0 0 1000 667" preserveAspectRatio="none" aria-label="Amir Temur davlati kengayishi xaritasi"><defs><marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff3c4"/></marker></defs><g id="grid"></g><g id="areas"></g><g id="routes"></g></svg><div id="spots"></div></div>
    <div class="float cap"><b>★ Poytaxt: Samarqand</b></div>
    <div class="float leg"><div class="row"><span class="dot"></span> Muhim janglar</div><div class="row"><span style="color:#f0d078">→</span> Yurish yo‘nalishlari</div></div>
  </div>
</div>
<footer class="bottom">
  <div class="bio-row"><div class="portrait">👑</div><div class="bio-text"><h3>AMIR TEMUR (1336–1405)</h3><p>Dono siyosati, kuchli armiyasi va madaniyatga e’tibori bilan o‘z davrining eng buyuk hukmdorlaridan biri.</p></div></div>
  <div><div class="cards-head"><h2>Janglar va muhim voqealar</h2></div><div class="cards" id="cards"></div></div>
</footer>
<dialog id="dlg"><button class="close-x" id="dlgClose">×</button><div id="dlgYear" style="color:var(--gold);font-size:11px;font-weight:700"></div><h3 id="dlgTitle"></h3><p id="dlgText"></p><p id="dlgPlace" style="color:var(--gold2);font-size:12px;margin-top:6px"></p><p style="margin-top:8px"><a id="dlgSrc" href="#" target="_blank" rel="noopener" style="color:var(--gold2);font-size:12px">Manba ↗</a></p></dialog>
<script>
(()=>{
'use strict';
// Map background loaded from same-origin image if present, else gradient
const img=document.getElementById('mapBg');
img.onerror=()=>{img.style.display='none';document.querySelector('.map-frame').style.background='radial-gradient(ellipse at 50% 45%,#1a2a3d,#0a121c)'};
img.src='temur-map-bg.jpg';
const $=id=>document.getElementById(id);
const LAT=[22,56],LNG=[22,88],W=1000,H=667;
const px=(lat,lng)=>[(lng-LNG[0])/(LNG[1]-LNG[0])*W,(LAT[1]-lat)/(LAT[1]-LAT[0])*H];
const pct=(lat,lng)=>{const [x,y]=px(lat,lng);return [x/W*100,y/H*100]};
let D=null,current=1390;
// Keep 3:2 geographic frame centered inside the stage
function fit(){const f=document.querySelector('.map-frame'),g=$('geo');const fw=f.clientWidth,fh=f.clientHeight;const w=Math.min(fw,fh*1.5),h=w/1.5;g.style.width=w+'px';g.style.height=h+'px'}
addEventListener('resize',fit);
function drawGrid(){let h='';for(let lng=30;lng<=80;lng+=10){const [x]=px(0,lng);h+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#ffffff14" stroke-width="1"/><text x="${x+3}" y="${H-5}" fill="#ffffff44" font-size="11">${lng}°E</text>`}for(let lat=25;lat<=55;lat+=10){const [,y]=px(lat,0);h+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#ffffff14" stroke-width="1"/><text x="4" y="${y-3}" fill="#ffffff44" font-size="11">${lat}°N</text>`}$('grid').innerHTML=h}
function stageIdx(y){let k=-1;D.stages.forEach((s,i)=>{if(y>=s.year)k=i});return k}
function buildTimeline(){const el=$('timeline');el.innerHTML=D.stages.map(t=>`<button class="tl-item${t.year===current?' active':''}" data-y="${t.year}"><span class="yr">${t.year}</span><span class="lb">${t.short}</span></button>`).join('');el.querySelectorAll('.tl-item').forEach(b=>b.onclick=()=>setYear(+b.dataset.y));const act=el.querySelector('.active');if(act&&act.scrollIntoView)act.scrollIntoView({inline:'center',block:'nearest'})}
function drawAreas(){const k=stageIdx(current);let h='';for(let i=k;i>=0;i--){const st=D.stages[i];const pts=st.polygon.map(([la,lo])=>px(la,lo).map(v=>v.toFixed(1)).join(',')).join(' ');h+=`<polygon points="${pts}" fill="${st.color}" fill-opacity=".38" stroke="${st.color}" stroke-width="1.6" stroke-linejoin="round"><title>${st.year} • ${st.areaName} (sxematik)</title></polygon>`}$('areas').innerHTML=h}
function drawRoutes(){$('routes').innerHTML=D.routes.filter(r=>current>=r.from).map(r=>{const pts=r.path.map(([la,lo])=>px(la,lo).map(v=>v.toFixed(1)).join(',')).join(' ');return `<polyline points="${pts}" fill="none" stroke="#fff3c4" stroke-width="2.2" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round" opacity=".9" marker-end="url(#arr)" vector-effect="non-scaling-stroke"><title>${r.label} (${r.from}${r.to>r.from?'–'+r.to:''})</title></polyline>`}).join('')}
function buildSpots(){const cap=D.capital;const [cx,cy]=pct(cap.coords[0],cap.coords[1]);let h=`<button class="hotspot capital" style="left:${cx}%;top:${cy}%" title="${cap.name}">★<i class="pl">${cap.name}</i></button>`;D.battles.forEach(b=>{const [x,y]=pct(b.coords[0],b.coords[1]);h+=`<button class="hotspot" data-id="${b.id}" data-year="${b.year}" style="left:${x}%;top:${y}%" title="${b.title}">⚔<i class="yr">${b.year}</i></button>`});$('spots').innerHTML=h;$('spots').querySelectorAll('.hotspot[data-id]').forEach(h=>h.onclick=()=>openDlg(D.battles.find(b=>b.id===h.dataset.id)))}
function buildCards(){const el=$('cards');const list=D.battles.filter(b=>b.year<=current);el.innerHTML=list.map(b=>`<article class="card" data-id="${b.id}"><div class="cy">${b.year}</div><h4>${b.title}</h4><p>${b.place}</p></article>`).join('')||'<p style="font-size:11px;color:var(--muted)">Bu bosqichgacha muhim jang qayd etilmagan.</p>';el.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDlg(D.battles.find(b=>b.id===c.dataset.id)))}
function setYear(y){current=y;buildTimeline();drawAreas();drawRoutes();document.querySelectorAll('.hotspot[data-year]').forEach(h=>h.classList.toggle('hidden',current<+h.dataset.year));buildCards()}
function openDlg(b){$('dlgYear').textContent=b.year+' · '+b.place;$('dlgTitle').textContent=b.title;$('dlgText').textContent=b.detail;$('dlgPlace').textContent=b.summary;$('dlgSrc').href=b.source;$('dlg').showModal()}
$('dlgClose').onclick=()=>$('dlg').close();
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')$('dlg').close()});
fit();drawGrid();
fetch('data/campaigns/timur.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;buildSpots();setYear(1390);fit()}).catch(()=>{$('cards').innerHTML='<p style="font-size:11px;color:var(--muted)">Ma’lumot yuklanmadi (data/campaigns/timur.json). Sahifani server orqali oching.</p>'});
})();
</script>
</body>
</html>
