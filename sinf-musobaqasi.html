<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilim Kechasi</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#12151C}#msg{font-family:sans-serif;color:#888;padding:40px}</style>
</head>
<body>
<p id="msg">Yuklanmoqda...</p>
<script>
(async function () {
  var msg = document.getElementById('msg');
  try {
    var url = 'https://cdn.jsdelivr.net/gh/aziyz123/aziyz123.github.io@9b1abdba2c4f4f427f37cbc2c64d9f723665798d/sinf-musobaqasi.html';
    var html = await fetch(url).then(function (r) {
      if (!r.ok) throw new Error('Yuklash xatosi: ' + r.status);
      return r.text();
    });

    // 1) Bonus ballni 2x qilish (faqat birinchi team.score += session.halfPoints)
    var replaced = false;
    html = html.replace(/team\.score \+= session\.halfPoints;/g, function (m) {
      if (!replaced) {
        replaced = true;
        return 'const bonusPts = session.correctPoints * 2; team.score += bonusPts;';
      }
      return m;
    });

    // 2) Matnda ham 2x ko'rinsin
    html = html.replace(
      "jamoasiga +' + session.halfPoints + ' ball",
      "jamoasiga +' + bonusPts + ' ball"
    );

    // To'liq sahifani ochish
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    msg.innerHTML = 'Xato: ' + (e.message || e) +
      '<br><br><a style="color:#C9A45C" href="https://cdn.jsdelivr.net/gh/aziyz123/aziyz123.github.io@9b1abdba2c4f4f427f37cbc2c64d9f723665798d/sinf-musobaqasi.html">Eski versiyani ochish</a>';
  }
})();
</script>
</body>
</html>
