<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bilim Kechasi</title></head>
<body>
<script>
(async function(){
  try {
    const parts = await Promise.all([0,1,2].map(i => fetch('sinf-b64-'+i+'.txt').then(r=>{ if(!r.ok) throw new Error('qism '+i); return r.text(); })));
    const b64 = parts.join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML='<p style="font-family:sans-serif;padding:40px;color:#c00">Xato: '+e.message+'</p>';
  }
})();
</script>
<p style="font-family:sans-serif;padding:40px;color:#888">Yuklanmoqda...</p>
</body></html>
