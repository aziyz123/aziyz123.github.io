plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.oquv.vositalari'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.oquv.vositalari'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Barqaror imzo: yangilanganda ilovani o'chirib qayta o'rnatish shart emas
    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'oquv2026'
            keyAlias 'oquv'
            keyPassword 'oquv2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
