plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.oquv.vositalari'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.oquv.vositalari'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Barqaror imzo: yangilanganda ilovani o'chirib qayta o'rnatish shart emas
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
