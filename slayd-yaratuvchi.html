<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Slayd Yaratuvchi</title></head>
<body>
<script>
(async function(){
  try{
    const [a,b]=await Promise.all([
      fetch('slayd-p1.txt?v=3').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}),
      fetch('slayd-p2.txt?v=3').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
    ]);
    const blob=new Blob([a+b],{type:'text/html;charset=utf-8'});
    location.replace(URL.createObjectURL(blob));
  }catch(e){
    document.body.innerHTML='<p style="font-family:sans-serif;padding:40px;color:#c00">Yuklash xatosi: '+e.message+'</p>';
  }
})();
</script>
<p style="font-family:sans-serif;padding:40px;color:#888">Yuklanmoqda...</p>
</body></html>
